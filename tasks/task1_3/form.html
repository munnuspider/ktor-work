<form action="https://httpbin.io/dump/request" method="POST">
  <p>
  <label for="em">Enter your name:</label>
  <input type="text" id="em" name="name">
  </p>
  <p>
  <label for="em">Enter your email:</label>
  <input type="email" id="em" name="email">
  </p>
  <p>
  <label for="em">Enter your date of birth:</label>
  <input type="datetime-local" name="datetime" id="datetime" />
  </p>
  <p>
  <label for="em">Enter your favourite colour:</label>
  <input type="color" name="color" id="color" />
  </p>
  <p>
    <fieldset>
    <legend>Are you a member of staff or a student?</legend>
    <ul>
        <li>
        <label for="staff">Staff</label>
        <input type="radio" id="staff" name="status" value="staff" checked />
        </li>
        <li>
        <label for="student">Student</label>
        <input type="radio" id="student" name="status" value="student" />
        </li>
    </ul>
    </fieldset>
  </p>
  <p>
  <input type="submit">
  </p>
</form>
